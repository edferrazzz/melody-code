name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (Standalone + VST3)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel --target MelodyCode_Standalone MelodyCode_VST3 melodycode_tests melodycode_audio_tests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/MelodyCode_artefacts/Release/Standalone/Melody Code.exe" "dist/Melody Code.exe"
          Copy-Item -Recurse "build/MelodyCode_artefacts/Release/VST3/Melody Code.vst3" "dist/Melody Code.vst3"
          Get-ChildItem -Recurse dist -Include *.pdb,*.lib,*.exp | Remove-Item
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer/MelodyCode.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish installer to the repo
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Release/Windows | Out-Null
          Copy-Item "dist/Melody Code * Instalador.exe" Release/Windows/
          $v = (Select-String -Path CMakeLists.txt -Pattern 'VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          Compress-Archive -Force -Path "dist/Melody Code.vst3" -DestinationPath "Release/Windows/Melody Code $v VST3 Windows.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Release/Windows
          git diff --cached --quiet
          if ($LASTEXITCODE) {
            git commit -m "Windows installer from CI (MSVC) [skip ci]"
            for ($i = 0; $i -lt 5; $i++) { git pull --rebase origin main; git push origin HEAD:main; if (!$LASTEXITCODE) { break }; Start-Sleep 10 }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: melody-code-windows-${{ github.sha }}
          path: dist/
          retention-days: 14

  macos:
    name: macOS (Standalone + VST3 + AU)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel --target MelodyCode_Standalone MelodyCode_VST3 MelodyCode_AU melodycode_tests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -R core
      - name: Collect
        run: |
          mkdir -p dist
          cp -R "build/MelodyCode_artefacts/Release/Standalone/Melody Code.app" dist/
          cp -R "build/MelodyCode_artefacts/Release/VST3/Melody Code.vst3" dist/
          cp -R "build/MelodyCode_artefacts/Release/AU/Melody Code.component" dist/
          cd dist && zip -qry ../melody-code-macos.zip .
      - name: Installer
        run: |
          V=$(sed -n 's/^project(MelodyCode VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p pkg/vst3 pkg/au pkg/app out
          cp -R "dist/Melody Code.vst3" pkg/vst3/
          cp -R "dist/Melody Code.component" pkg/au/
          cp -R "dist/Melody Code.app" pkg/app/
          pkgbuild --root pkg/vst3 --identifier com.audiomakers.melodycode.vst3 --version "$V" --install-location "/Library/Audio/Plug-Ins/VST3" out/vst3.pkg
          pkgbuild --root pkg/au --identifier com.audiomakers.melodycode.au --version "$V" --install-location "/Library/Audio/Plug-Ins/Components" out/au.pkg
          pkgbuild --root pkg/app --identifier com.audiomakers.melodycode.app --version "$V" --install-location "/Applications" out/app.pkg
          cat > out/dist.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>Melody Code $V</title>
            <options customize="always" require-scripts="false" hostArchitectures="arm64,x86_64"/>
            <choices-outline><line choice="vst3"/><line choice="au"/><line choice="app"/></choices-outline>
            <choice id="vst3" title="VST3" description="Plugin VST3 em /Library/Audio/Plug-Ins/VST3"><pkg-ref id="com.audiomakers.melodycode.vst3"/></choice>
            <choice id="au" title="Audio Unit" description="Plugin AU (Logic, GarageBand) em /Library/Audio/Plug-Ins/Components"><pkg-ref id="com.audiomakers.melodycode.au"/></choice>
            <choice id="app" title="App Standalone" description="Melody Code em /Applications"><pkg-ref id="com.audiomakers.melodycode.app"/></choice>
            <pkg-ref id="com.audiomakers.melodycode.vst3">vst3.pkg</pkg-ref>
            <pkg-ref id="com.audiomakers.melodycode.au">au.pkg</pkg-ref>
            <pkg-ref id="com.audiomakers.melodycode.app">app.pkg</pkg-ref>
          </installer-gui-script>
          XML
          sed -i '' 's/^          //' out/dist.xml
          productbuild --distribution out/dist.xml --package-path out "Melody Code $V Instalador Mac.pkg"
          (cd dist && ditto -c -k --keepParent "Melody Code.vst3" "../Melody Code $V VST3 Mac.zip")
      - name: Publish Mac installer to the repo
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p Release/macOS
          cp Melody\ Code\ *\ Instalador\ Mac.pkg Melody\ Code\ *\ VST3\ Mac.zip Release/macOS/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Release/macOS
          if ! git diff --cached --quiet; then
            git commit -m "macOS installer from CI [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: melody-code-macos-${{ github.sha }}
          path: melody-code-macos.zip
          retention-days: 14
